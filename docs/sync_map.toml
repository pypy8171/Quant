# sync_map.toml — 소스가 바뀌면 같이 봐야 할 대표 문서 (기계용, D-075)
#
# docs/SYNC_MAP.md §2 표의 기계 형식이다. ../quant-devtools/sync_impact.py가 읽어
# "바뀐 파일 → 봐야 할 문서"를 찍는다. 표를 손으로 둘 다 고치지 말고 여기만 고친다 —
# SYNC_MAP.md §2는 `py ../quant-devtools/sync_impact.py --render`가 만든다.
#
# 항목:
#   src   = 바뀌면 트리거되는 파일 glob 목록 (저장소 루트 기준, ** 허용)
#   deps  = 봐야 할 대표 문서. "파일#절"은 절 이름 힌트
#   fix_cmd = (script만, 선택) --fix 때 cmd 대신 돌리는 재생성 명령. 성공하면 막지 않는다
#   check = "gen"     : deps의 <!-- gen: --> 블록으로 자동 재생성된다 (사람 판단 없음)
#           "script"  : cmd 명령이 재생성·검사한다
#           "stamp"   : deps 안의 <!-- sync: --> 도장이 낡음을 잡는다 (판단은 사람)
#           "hint"    : 매핑만 있고 검사 수단이 없다 — 힌트 1회 보고
#   note  = 무엇을 맞춰야 하는지 한 줄

[[rule]]
src = ["scripts/market_close_timetable.ps1"]
deps = ["docs/AUTOMATION.md#1. OS 예약작업"]
check = "gen"
note = "마감 시간표(모의/실계좌)는 gen:market-close-timetable 블록. _private/AUTOMATION_HUB.md 는 gen_facts --apply 가 같이 다시 쓴다"

[[rule]]
src = ["scripts/market_close_timetable.ps1"]
deps = ["docs/guides/MAINTENANCE_AUTOMATION.md#자동화 층", ".claude/commands/dashboard-sync.md", ".claude/commands/auto-trade-day.md", ".claude/skills/stock-study/SKILL.md"]
check = "hint"
note = "예약작업 시각을 글로 적은 곳. 시각 숫자는 넣지 말고 허브·시간표 스크립트를 가리키게 한다"

[[rule]]
src = ["PYQuant/tools/macro_regime_feed.py"]
deps = ["docs/premarket/ROUTINE_PROMPT.md#이 시스템의 국면 모델"]
check = "gen"
note = "루틴 프롬프트 안의 국면 모델(지표 8개·임계·정지/청산선)은 gen:regime-model 블록. 블록이 바뀌면 check_docs 가 '올린 것과 다르다'고 잡는다 → /schedule 로 다시 올리고 premarket_routine.py --mark"

[[rule]]
src = ["Quant/CMakeLists.txt", "Quant/tests/test_*.cpp"]
deps = ["docs/guides/PROJECT_GUIDE.md#단위 테스트"]
check = "gen"
note = "테스트 타깃 목록·개수는 gen:test-targets 블록이 채운다"

[[rule]]
src = ["Quant/include/strategy/*.h", "Quant/src/strategy/StrategyFactory.cpp", "PYQuant/strategy/*.py"]
deps = ["README.md", "docs/guides/PROJECT_GUIDE.md", ".claude/PROJECT_FACTS.md"]
check = "gen"
note = "전략 클래스·로더 표는 gen:cpp-strategies / gen:py-strategies 블록"

[[rule]]
src = [".claude/commands/*.md", ".claude/agents/*.md", ".claude/skills/**", ".claude/hooks/*.ps1", ".claude/settings.json"]
deps = ["docs/HARNESS.md", "docs/AUTOMATION.md#훅"]
check = "gen"
note = "개수·훅 배선표는 gen:harness-counts / gen:hooks 블록. 훅이 하는 일 설명 문단은 stamp"

[[rule]]
src = ["Quant/include/**/*.h", "Quant/src/**/*.cpp"]
deps = ["docs/CODE_GRAPH.md"]
check = "script"
cmd = "py ../quant-devtools/gen_code_graph.py --check"
note = "#include 그래프는 손편집 금지, 재생성"

[[rule]]
src = ["Quant/include/**/*.h", "Quant/src/**/*.cpp", "docs/code_flow.toml"]
deps = ["docs/CODE_FLOW.md"]
check = "script"
cmd = "py ../quant-devtools/gen_code_flow.py --check"
fix_cmd = "py ../quant-devtools/gen_code_flow.py"
note = "코드 흐름 문서의 줄 링크·시그니처는 재생성(fix_cmd). 심볼이 사라지면 code_flow.toml의 sym을 고친다"

[[rule]]
src = ["Quant/include/**/*.h", "Quant/src/**/*.cpp", "scripts/*.py", "scripts/*.ps1", "PYQuant/tools/*.py", "PYQuant/data/*.py",
       "docs/tuning_sheet.toml", "scripts/gen_tuning_sheet.py"]
deps = ["_private/TUNING_SHEET.md", "_private/TUNING_CYCLE.md"]
check = "script"
cmd = "py scripts/gen_tuning_sheet.py --check"
fix_cmd = "py scripts/gen_tuning_sheet.py"
note = "장중 매매 수치·주기 시트는 재생성(fix_cmd). config 변경은 git diff 에 안 잡히므로 sync-gate 가 매 턴 --check 를 따로 돈다. code_value 정규식이 안 잡히면 tuning_sheet.toml 을 고친다"

[[rule]]
src = ["docs/DECISIONS.md", "Quant/config/config_dev_paper.json"]
deps = ["research/STRATEGY_LAB.md", ".claude/PROJECT_FACTS.md"]
check = "script"
cmd = "py ../quant-devtools/sync_ledgers.py --check"
note = "**원장**:·**음성결과**: 줄에서 마커 구간 생성"

[[rule]]
src = ["Quant/include/core/*.h", "Quant/src/core/*.cpp", "Quant/src/main.cpp"]
deps = ["docs/ENGINE_ARCHITECTURE.md#아키텍처", "docs/guides/PROJECT_GUIDE.md"]
check = "stamp"
note = "스레드 모델·모듈 책임 요약 문단. 헤더의 공개 역할이 바뀌면 문단을 고치고 --restamp"

[[rule]]
src = ["Quant/include/api/*.h", "Quant/src/api/*.cpp"]
deps = ["docs/ENGINE_ARCHITECTURE.md#KIS API 클라이언트", "docs/ENGINE_ARCHITECTURE.md#WebSocket 클라이언트"]
check = "stamp"
note = "파일 분할·인터페이스·채널 목록 요약"

[[rule]]
src = ["Quant/include/risk/*.h", "Quant/src/risk/*.cpp"]
deps = ["README.md", "docs/GLOSSARY.md"]
check = "stamp"
note = "OrderGate 거부 사유·한도 설명. 거부 지점 개수는 gen:ordergate-rejects"

[[rule]]
src = ["Quant/tools/ops_terminal/**"]
deps = ["docs/guides/MFC_TERMINAL.md", "_private/LINKS.md"]
check = "stamp"
note = "화면·스레드 모델·빌드 조건 절 + 이력 한 줄. 실행 방법이 바뀌면 LINKS.md 운영단말 행"

[[rule]]
src = ["scripts/dashboard_server.py", "PYQuant/dashboard/**"]
deps = ["docs/design/DASHBOARD_SPEC.md"]
check = "stamp"
note = "API·데이터 계약"

[[rule]]
src = ["scripts/*.py", "scripts/*.ps1"]
deps = ["docs/AUTOMATION.md#스크립트", "docs/SYNC_MAP.md"]
check = "hint"
note = "새 스크립트는 AUTOMATION.md 표에 행. 검사기·생성기면 SYNC_MAP.md에도"

[[rule]]
src = ["research/studies/*/README.md"]
deps = ["research/studies/README.md", "research/BACKTESTS.md", "research/README.md"]
check = "script"
cmd = "py ../quant-devtools/check_docs.py"
note = "색인 등재는 check_docs가 잡는다. 요지 1줄·타임라인 서사는 사람"

[[rule]]
src = ["strategies/*/SPEC.md", "strategies/*/live/*.md"]
deps = ["strategies/README.md", "README.md"]
check = "hint"
note = "표에 SPEC·실증·검증경로 행"

[[rule]]
src = ["docs/STYLE_GUIDE.md"]
deps = ["CLAUDE.md#문서 문체 규약", ".claude/hooks/lexicon-gate.ps1"]
check = "hint"
note = "금지 표현을 추가했으면 게이트 두 곳의 사전도"

[[rule]]
src = ["docs/guides/CODE_CONVENTIONS.md"]
deps = ["CLAUDE.md#코드 작업 규약"]
check = "hint"
note = "규약을 더하거나 예외를 늘리면 검사기 규칙과 판정 표도. 약어 예외는 rename_frags.py의 SKIP·WIRE가 정본"

[[rule]]
src = ["docs/sync_map.toml"]
deps = ["docs/SYNC_MAP.md", "docs/AUTOMATION.md#스크립트", "docs/HARNESS.md"]
check = "script"
cmd = "py ../quant-devtools/sync_impact.py --render --check"
note = "SYNC_MAP.md §2 표는 이 파일에서 생성"

[[rule]]
src = ["docs/RUNBOOK.md"]
deps = ["docs/RUNBOOK.html"]
check = "script"
cmd = "py ../quant-devtools/gen_runbook.py --check"
fix_cmd = "py ../quant-devtools/gen_runbook.py"
note = "운영 런북 HTML 은 RUNBOOK.md 에서 통째로 렌더(gitignore). 코드 블록의 스크립트 경로가 없으면 --check 가 잡는다"

[[rule]]
src = ["scripts/auto_trade_day.ps1", "scripts/auto_trade_guard.ps1", "scripts/dashboard_server.py", "scripts/parse_quant_log.py", "scripts/notify_trades.py", "PYQuant/tools/macro_regime_feed.py", "PYQuant/tools/universe_feed.py", "PYQuant/tools/investor_flow_logger.py", "PYQuant/tools/index_intraday_logger.py", "docs/guides/OPS_TERMINAL.md", "docs/guides/MFC_TERMINAL.md"]
deps = ["docs/RUNBOOK.md"]
check = "stamp"
note = "런북이 인용하는 스크립트 인자·옵션. 절 머리 도장이 낡으면 그 절의 명령을 맞추고 --restamp docs/RUNBOOK.md"

[[rule]]
src = ["research/COUNCIL_CHARTER.md", "research/GUARDRAILS.md"]
deps = ["research/RESEARCH_COUNCIL.md#멤버와 역할", ".claude/agents/bias-auditor.md", ".claude/AGENTS.md"]
check = "hint"
note = "헌장·규율(D-101)이 바뀌면 회의 멤버 표, 편향 감사관의 대조 기준, 에이전트 색인을 같이 본다"
