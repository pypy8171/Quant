# tuning_sheet.toml — 장중 매매 수치·주기 시트의 정본 (기계용)
#
# _private/TUNING_SHEET.md 는 `py scripts/gen_tuning_sheet.py` 가 여기와 실행 중 config 에서 만든다 — 시트를 손으로 고치지 않는다.
# 여기 적는 것은 두 가지뿐이다.
#   1. config 키를 어느 묶음으로 보여줄지([[config_group]])와 접미사로 못 정하는 단위([[config_key]])
#   2. 코드에 박힌 상수를 어디서 뽑을지([[code_value]]) — 값 자체는 적지 않는다. 생성기가 정규식 첫 그룹을 소스에서 읽는다.
#      정규식이 안 잡히면 --check 가 exit 1 (턴 끝 sync-gate · 커밋 docs-gate). 그러면 여기 정규식을 고친다.
#
# [[config_group]]  name = 묶음 이름(시트 3절 소제목, 위에서부터 순서대로), keys = 키 glob(전체 경로 `strategies[0].scan_top_n` 또는 마지막 조각), note = 묶음 설명 한 줄(선택)
# [[config_key]]    key = 키 glob, unit = 단위 (접미사 규칙보다 우선)
# [[code_value_group]]  name = 코드 상수만 있는 묶음 이름·note (config_group 과 같은 이름이면 그 묶음에 합쳐진다)
# [[code_value]]        id = 시트에 보일 이름, file = 저장소 루트 기준 경로, regex = 값이 첫 그룹인 정규식(멀티라인, 첫 매치),
#                   unit = 단위(초·ms·분·hhmm·개·원·%…; 초·ms·분이면 1절 주기 표에도 오른다), group = 묶음 이름,
#                   meaning = 한 줄 의미, config_key = (선택) 이 상수를 덮어쓰는 config 키

# ----------------------------- config 묶음 -----------------------------

[[config_group]]
name = "실행 모드·엔진 공통"
keys = ["mode", "log_level", "fetch_interval_sec", "bootstrap_ledger_from_balance", "rest_price_feed", "ops_port"]
note = "트레이더 프로세스 전체에 걸리는 값. fetch_interval_sec 는 REST 폴러(DataPoller) 주기."

[[config_group]]
name = "국면(regime) — 매크로 보조 프로세스"
keys = ["regime_file", "regime_stale_sec", "regime_strategies.*"]
note = "PYQuant/tools/macro_regime_feed.py 가 regime.json 을 쓰고 엔진 데이터 스레드가 매 주기 읽어(poll_regime_file) 전략 on/off 를 정한다."

[[config_group]]
name = "유니버스 스캔 — KIS 랭킹 · data.go.kr · 업종"
keys = ["universe_file", "universe_from_scan", "full_market", "scan_top_n", "value_top_n", "sector_*", "max_universe", "score_top_n",
        "min_price", "max_price", "min_turnover", "risk_off_index_pct*", "kosdaq_enabled", "union_refresh_sec", "prices_file"]
note = "후보 합집합(data.go.kr 파일 ∪ KIS 시총·거래대금 랭킹 ∪ 업종 등락 축)을 union_refresh_sec 마다 다시 만든다."

[[config_group]]
name = "유니버스 판정 — 정배열·이격·리스캔"
keys = ["require_aligned", "align_*", "max_dev_pct", "rescan_*", "daily_lookback"]
note = "합집합의 각 종목을 일봉(KIS, 종목·일 1회 캐시)으로 정배열·이격 판정하고 rescan_interval_sec 마다 재판정한다. 부재 종목 차단·해제 규칙은 D-077."

[[config_group]]
name = "사이징 — 주문 크기"
keys = ["base_pct", "max_pct", "weight_*", "notional_*", "score_w_*", "fallback_equity", "base_qty", "step_qty", "split_step_count", "buy_split_steps", "dust_krw"]
note = "notional_floor/cap_krw 가 둘 다 >0 이면 원 단위가 우선(D-036), 점수 z 를 바닥~천장에 대응."

[[config_group]]
name = "전략 신호 — 진입·주문 재구성"
keys = ["type", "id_prefix", "sma_period", "dev_sell_pct", "dev_buy_pct", "min_dev_pct", "pullback_pct", "entry_upper_pct", "entry_lower_pct", "zone_hyst_pct",
        "base_on_price", "reprice_move_ticks", "min_rebuild_sec", "interval_min", "min_action_ms", "reentry_cooldown_sec", "add_below_sma_only",
        "split_buy_cross_guard", "market", "exchange", "quantity", "pbr_max"]
note = "3분봉 SMA 기준 눌림 매수·이격 매도. 단위 함정: entry_upper_pct 는 퍼센트(5.0), max_dev_pct 는 분수(0.05)인데 같은 임계를 가리킨다."

[[config_group]]
name = "청산 — 손절·트레일·장마감"
keys = ["stop_loss_pct", "stop_cooldown_sec", "sell_base_average", "trail_sma_*", "market_close_exit_hhmm"]
note = "슬리브 자체 보유분의 청산 규칙. 승계 보유분은 아래 manage_holdings 가 따로 본다."

[[config_group]]
name = "승계 보유분 청산 관리 — manage_holdings"
keys = ["*.manage_holdings.*"]
note = "스캔 밖 잔고 보유분에 붙는 청산 전용 ITB 래퍼. market_close_exit_hhmm=2100 이면 장중 강제청산 없이 보호만."

[[config_group]]
name = "리스크 — OrderGate 단일 시퀀서"
keys = ["risk.*"]
note = "주문이 나가기 전 마지막 관문. 슬롯 수(max_concurrent_positions)·교체(displace_*)·손실 한도·발주 속도."

