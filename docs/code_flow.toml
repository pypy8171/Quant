[[stage]]
id = "fill"
name = "6. 체결 — [시세→주문] 체결통보가 원장에 닿기까지"
summary = "체결통보(H0STCNI0/H0STCNI9)는 WS로 오므로 시세 프로세스가 복호화·디코드만 하고 공유 체결 채널에 넣는다. 원장을 쥔 주문 프로세스의 체결 스레드가 꺼내 라우터의 `on_fill`로 원장(`PositionLedger`)을 갱신하고, 원장 스냅숏을 발행해 전략 쪽이 읽게 한다. 한 프로세스면 채널 대신 `pipeline_.fill_queue`를 쓴다."
review = [
  "ODNO가 라우터 기억(`history_`)에 없는 체결(재기동 뒤 미체결)도 원장·포지션에 반영되는지(미연결 체결 경로)",
  "부분 체결이 여러 번 와도 `reserved_`가 정확히 남은 수량만큼 풀리는지",
  "체결 처리 중 수신 스레드가 서지 않는지 — 수신은 push만(D-056). 채널이 차면 넘친 통보를 쌓아 두었다 다시 보내는지",
]

  [[stage.step]]
  sym = "KisWebSocket::parse_fill_notification"
