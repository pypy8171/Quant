# code_flow.toml — 실시간 매매(TRADE) 코드 흐름을 읽는 순서 (기계용, D-078)
#
# docs/CODE_FLOW.md는 이 파일에서 `py scripts/gen_code_flow.py`가 만든다 — 문서를 손으로 고치지 말고 여기를 고친다.
# 줄 번호는 여기 없다. 생성기가 심볼을 소스에서 찾아 `파일#L줄` 링크와 시그니처 한 줄을 채우고, 심볼이 사라지면
# `--check`가 exit 1로 막는다(턴 끝 sync-gate·커밋 docs-gate). 그러니 여기 적을 것은 "무엇을 어느 순서로 보나"뿐이다.
#
# 항목:
#   [[stage]]        읽는 단계. id·name·summary. review는 그 단계에서 리뷰할 때 볼 항목(선택)
#   [[stage.step]]   단계 안의 한 걸음. 순서대로 나온다
#     sym   = 심볼. "Class::method" · "ns::fn" · "fn" · 타입 이름(struct/class). 마지막 조각으로 찾고 앞 조각은 정의 줄 우선에 쓴다
#     file  = 저장소 루트 기준 경로. 정의(.cpp)가 있으면 정의 파일, 헤더 온리면 헤더
#     what  = 여기서 볼 것 한 줄
#     match = (선택) 이름 없는 자리(람다·블록)를 가리킬 정규식. 있으면 sym 대신 이걸로 줄을 찾는다
#     test  = (선택) 이 걸음을 덮는 단위 테스트 실행 타깃 이름(Quant/tests/<test>.cpp)

title = "실시간 매매 코드 흐름 (CODE_FLOW)"

intro = """
TRADE 모드에서 틱 하나가 들어와 주문이 나가고 체결이 원장에 닿기까지를 **읽는 순서대로** 나열한 문서다.
단계마다 심볼 링크(`파일#L줄`)·시그니처·볼 것 한 줄·덮는 테스트가 있다. 링크는 VS Code 미리보기·GitHub에서 그 줄로 열린다.

스레드 모델·설계 원칙은 [CLAUDE.md](../CLAUDE.md)의 "설계 목표와 원칙"·"아키텍처" 절이 정본이고, 모듈 간 include 관계는
[CODE_GRAPH.md](CODE_GRAPH.md), 바꾼 이유는 [DECISIONS.md](DECISIONS.md)다. 이 문서는 그 셋을 대신하지 않고 **입구**만 맡는다.
"""

diagram = """
flowchart LR
  subgraph recv[1. 수신 — 소켓 스레드 N]
    WS[KisWebSocket::recv_loop] --> DEC[kis_websocket::decode_*] --> CB[Engine WS 콜백]
  end
  subgraph mx[SPSC 링 행렬]
    CB --> TD[pipeline_.trade_matrix / order_book_matrix (행=수신 레인, 열=샤드)]
    DP[DataPoller REST 대체 틱] --> TD
  end
  subgraph shard[2. 샤드 스레드 M]
    TD --> ST[strategy::Shard::step] --> RT[strategy::Router::for_each] --> S[StrategyBase::on_trade_batch]
    S --> EM[strategy::Emitted]
  end
  EM --> SO[pipeline_.shard_out MpscQueue]
  subgraph disp[3. 디스패치 스레드]
    SO --> SD[SignalDispatcher::from_strategy] --> OQ[pipeline_.order_queue SPSC]
  end
  subgraph ord[4. 주문 스레드]
    OQ --> PC[OrderPacer] --> OR[OrderRouter::new_route] --> OG[OrderGate::check] --> KIS[KisClient::submit_order_acknowledgement]
  end
  subgraph fill[5. 체결 스레드]
    FN[parse_fill_notification] --> FQ[pipeline_.fill_queue SPSC] --> OF[OrderRouter::on_fill] --> OGF[OrderGate::on_fill_confirmed]
  end
  KIS -. ODNO .-> OR
  WS -. H0STCNI9 .-> FN
"""

# ───────────────────────────────────────────────────────────────────────────────

[[stage]]
id = "boot"
name = "0. 기동 — config에서 스레드가 서기까지"
summary = "config를 `AppConfig`로 읽고 `Engine::configure`가 세터에 옮기고 전략을 만든 뒤, `Engine::start()`가 행렬·샤드·원장·소켓 콜백·스레드 다섯을 세운다. 이 절만 읽으면 누가 무엇을 소유하는지 보인다."
review = [
  "스레드 소유권 — 각 큐의 생산자·소비자가 하나씩인지(`RingBuffer`는 SPSC, 생산자 둘이면 `MpscQueue`, 원칙 5)",
  "config 키가 `parse_config`에서 검증되고 `Engine::configure`가 세터로 옮기는지 — 빠진 키의 기본값이 실계좌에 안전한 쪽인지",
  "기동 순서 — 원장 시드(`bootstrap`)가 소켓 콜백 설치보다 앞인지(체결이 먼저 오면 원장이 비어 있다)",
]

  [[stage.step]]
  sym = "main"
  file = "Quant/src/main.cpp"
  what = "진입. 번호 주석이 초기화 순서다 — 콘솔·로거 → 인자 → `parse_config` → 로그 임계값 → 크래시 핸들러 → 모드 분기(FEED·KR_TEST·US_TEST는 modes/, TRADE는 `run_trade`)"

  [[stage.step]]
  sym = "parse_config"
  file = "Quant/src/core/AppConfig.cpp"
  what = "json → `AppConfig`. 키 누락·값 오류는 여기서 멈춘다(네트워크 전). 모드 오버라이드(인자)도 여기서 반영"

  [[stage.step]]
  sym = "run_trade"
  file = "Quant/src/main.cpp"
  what = "`Engine engine(...)` → `engine.configure(app)` → `load_strategies` → `engine.start()` → `is_running` 대기 → `engine.stop()`. join은 여기 한 곳"

  [[stage.step]]
  sym = "Engine::configure"
  file = "Quant/src/core/EngineConfigure.cpp"
  what = "AppConfig 값을 엔진 세터로 — 채널(ZMQ·운영단말)·국면별 전략 집합·기동 점검·시세 전용 KIS·리스크(게이트 한도·매매 창) 다섯 묶음"

  [[stage.step]]
  sym = "load_strategies"
  file = "Quant/src/strategy/StrategyFactory.cpp"
  what = "config `strategies[]`를 전략 객체로. 새 전략을 붙이는 자리(docs/ENGINE_ARCHITECTURE.md '전략 추가하기')"

  [[stage.step]]
  sym = "Engine::add_strategy"
  file = "Quant/src/core/Engine.cpp"
  what = "전략 등록. 심볼 해석기(`set_symbol_resolver` → `SymbolTable::intern`)가 여기서 주입된다"

  [[stage.step]]
  sym = "Engine::start"
  file = "Quant/src/core/Engine.cpp"
  what = "도우미 호출 목록이 기동 순서다 — `setup_shards`(행렬 `reshape`, 행=수신 레인+폴러, 열=샤드) → ZMQ → 모의 체결기 → 라우터·대조기·폴러 → `try_bootstrap_ledger`(원장 시드) → `start_strategies` → 구독 목록 → `connect_feed` → `spawn_threads`"

  [[stage.step]]
  sym = "Engine::connect_feed (WS 콜백 설치)"
  file = "Quant/src/core/Engine.cpp"
  match = "set_lane_callbacks\\("
  what = "소켓 레인 i의 호가·체결 콜백. 종목 id로 열을 고르고(`consumer_of`) `pipeline_.trade_matrix`·`order_book_matrix`의 자기 행에 `push_to` — 가득 차면 버리고 센다(블로킹 금지)"

  [[stage.step]]
  sym = "Engine::spawn_threads"
  file = "Quant/src/core/Engine.cpp"
  match = "data_thread_\\s*=\\s*std::jthread"
  what = "data·strategy·order·fill·control 다섯 jthread + 샤드 M. stop_token이 첫 인자라 람다로 감싼다"

  [[stage.step]]
  sym = "LedgerReconciler::bootstrap"
  file = "Quant/src/core/LedgerReconciler.cpp"
  what = "기동 잔고 시드 — 브로커 잔고를 원장·게이트 포지션으로. 실패 재시도 횟수와 실패 시 기동 중단 여부"
  test = "test_ledger_reconciler"

# ───────────────────────────────────────────────────────────────────────────────

[[stage]]
id = "recv"
name = "1. 수신 — 소켓 바이트에서 링 행렬까지"
summary = "소켓 읽기 스레드는 얇다(원칙 3): 프레임 → 필드 분리 → 구조체 → `received_ns` 스탬프 → 행렬 push. 문자열은 여기서 끝나고 종목은 정수 id가 된다(원칙 6)."
review = [
  "수신 스레드에 힙 할당·문자열 생성·락이 있는지 — 있으면 소비자로 옮길 후보",
  "`received_ns`가 디코드 직후 한 번만 찍히는지(호가·체결 같은 시계, D-071)",
  "가득 찬 링에 블로킹하지 않는지 — 버리고 세는지(`dropped` 카운터가 로그에 나오는지)",
]

  [[stage.step]]
  sym = "KisWebSocket::recv_loop"
  file = "Quant/src/api/WebSocketClient.cpp"
  what = "소켓 하나 = 스레드 하나(원칙 1). 프레임 읽기 → `parse_message`. 끊김 감지와 재연결 신호"
  test = "test_ws_frame"

  [[stage.step]]
  sym = "KisWebSocket::parse_message"
  file = "Quant/src/api/WebSocketClient.cpp"
  what = "`|`로 헤더 분리 → 암호화 여부(체결통보는 AES) → `dispatch_record`. PINGPONG·구독 응답 처리도 여기"

  [[stage.step]]
  sym = "KisWebSocket::dispatch_record"
  file = "Quant/src/api/WebSocketClient.cpp"
  what = "tr_id로 채널 분기 — H0STCNT0 체결·H0STASP0 호가(KRX), H0UNCNT0/H0UNASP0(KRX+NXT 통합, D-096), H0IFCNT0/H0IFASP0 선물, H0STCNI0/H0STCNI9 체결통보(실/모의)"

  [[stage.step]]
  sym = "KisWebSocket::parse_kr_trade"
  file = "Quant/src/api/WebSocketClient.cpp"
  what = "`decode_kr_trade` → `trade.symbol_id`(SymbolTable) → `received_ns` 스탬프 → `on_trade_` 콜백. 호가는 `parse_orderbook`이 같은 모양"

  [[stage.step]]
  sym = "kis_websocket::decode_kr_trade"
  file = "Quant/include/api/KisWsDecode.h"
  what = "순수 함수. 필드 인덱스 → `TradeData`(가격·수량·`hhmmss` 정수·방향). 필드 번호가 [wire] 정본"
  test = "test_ws_decode"

  [[stage.step]]
  sym = "kis_websocket::decode_orderbook"
  file = "Quant/include/api/KisWsDecode.h"
  what = "5단계 호가 → `OrderBook`. 매도·매수 가격/잔량 필드 위치"
  test = "test_ws_decode"

  [[stage.step]]
  sym = "shard::Matrix::push_to"
  file = "Quant/include/core/ShardMatrix.h"
  what = "행(생산자)×열(소비자) SPSC 셀에 push. `consumer_of(sym)`이 종목 해시로 열을 고른다(원칙 2)"
  test = "test_shard_matrix"

  [[stage.step]]
  sym = "feed::FeedMux"
  file = "Quant/include/core/FeedMux.h"
  what = "소켓 여럿을 한 `IFeedSource`로. 레인 모드면 소켓 i 스레드가 행 i로 직접 push(mux 스레드 없음). 체결통보는 첫 소켓만"
  test = "test_feed_mux"

  [[stage.step]]
  sym = "Engine::data_thread_fn"
  file = "Quant/src/core/Engine.cpp"
  what = "REST 축 — 봉 폴링·`poll_regime_file`(국면)·잔고 대조·유니버스 재스캔·하루 경계(`new_trading_day`·`reset_daily`). 폴러의 대체 틱은 `pipeline_.trade_matrix`의 자기 행(`data_row`)으로 간다"

  [[stage.step]]
  sym = "DataPoller::poll_universe"
  file = "Quant/src/core/DataPoller.cpp"
  what = "REST 현재가 → 대체 `TradeData`(`received_ns`=0). 구독 상한 넘침·틱 끊긴 보유 보충(`top_up`)도 이 클래스"
  test = "test_data_poller"

  [[stage.step]]
  sym = "feed::TickCapture::on_trade"
  file = "Quant/include/core/TickCapture.h"
  what = "raw 틱 append-only 캡처(원칙 8). 리플레이(`ReplaySource`)의 입력"
  test = "test_tick_capture"

# ───────────────────────────────────────────────────────────────────────────────

[[stage]]
id = "shard"
name = "2. 샤드 — 틱이 전략을 만나 신호가 되기까지"
summary = "샤드 m은 자기 열만 비운다. 틱의 종목 id로 그 종목을 보는 전략만 방문하고(`Router`), `NONE`이 아닌 신호를 봉투에 싸서 `pipeline_.shard_out`에 넣는다. 전략 코드 리뷰는 이 절에서 시작한다."
review = [
  "전략이 문자열로 종목을 비교하는 곳이 있는지 — `same_symbol`/`trade.symbol_id` 정수 비교여야 한다(원칙 6)",
  "전략 `on_*`이 블로킹 I/O(REST)를 직접 부르는지 — DeviationScale은 프리페치 스레드로 뺐다",
  "`reference_price`를 시장가 신호에 찍는지 — 없으면 명목 백스톱이 우회된다(Types.h 주석)",
  "한 전략의 구독 종목이 열 둘에 걸치지 않는지(`owner_shard` 경고)",
]

  [[stage.step]]
  sym = "Engine::shard_thread_fn"
  file = "Quant/src/core/Engine.cpp"
  what = "전략 집합 버전이 바뀌면 `rebuild`, 아니면 `step`. 비면 `WakeGate`로 잠든다. `emit`은 `pipeline_.shard_out` push + 디스패치 스레드 깨우기"

  [[stage.step]]
  sym = "strategy::Shard::step"
  file = "Quant/include/core/StrategyShard.h"
  what = "열의 호가·체결·봉 셀을 순서대로 비우고 전략 배치 훅을 부른다. `on_price`로 현재가 캐시 갱신"
  test = "test_strategy_shard"

  [[stage.step]]
  sym = "strategy::Router::for_each"
  file = "Quant/include/core/StrategyRouter.h"
  what = "종목 id → 그 종목을 구독한 전략 목록. 구독을 안 밝힌 전략은 전부 받는다"
  test = "test_strategy_router"

  [[stage.step]]
  sym = "strategy::Emitted"
  file = "Quant/include/core/StrategyShard.h"
  what = "샤드 → 디스패치 봉투: 신호 + 전략 id + 활성 여부. 이 구조체가 두 스레드의 계약이다"

  [[stage.step]]
  sym = "StrategyBase::on_trade_batch"
  file = "Quant/include/strategy/StrategyBase.h"
  what = "전략 훅의 계약(가상 함수 다섯). 기본 구현은 `on_trade` 하나를 out에 담는다. `symbol_of`·`same_symbol`도 이 헤더"

  [[stage.step]]
  sym = "DeviationScaleStrategy::on_start"
  file = "Quant/include/strategy/DeviationScaleStrategy.h"
  what = "종목 id 받기·REST 봉 시드·프리페치 스레드. 전략 하나를 끝까지 따라가는 예로 이 전략을 쓴다"

  [[stage.step]]
  sym = "DeviationScaleStrategy::on_trade_batch"
  file = "Quant/include/strategy/DeviationScaleStrategy.h"
  what = "틱 → `aggregator_.on_tick` → 판단 직전 `close_stale`·`bars::resample` → 진입/청산 판단 → out. 매매 로직의 본체. 스탑·트레일 뒤 `stop_cooldown_sec`, 전량 청산 뒤 `reentry_cooldown_sec` 동안은 새 베이스를 깔지 않는다"

  [[stage.step]]
  sym = "bars::BarAggregator::on_tick"
  file = "Quant/src/core/BarAggregator.cpp"
  what = "체결 틱을 1분봉으로. `close_stale`은 틱이 없어도 시계로 지난 분을 닫는다(D-074)"
  test = "test_bar_aggregator"

  [[stage.step]]
  sym = "bars::resample"
  file = "Quant/include/core/BarAggregator.h"
  what = "1분봉 → `interval_min` 봉. 판단은 언제나 이 봉으로(D-072)"
  test = "test_bar_aggregator"

  [[stage.step]]
  sym = "DeviationScaleStrategy::emit_liquidation"
  file = "Quant/include/strategy/DeviationScaleStrategy.h"
  what = "청산 신호 조립 — 시장가면 `reference_price` 스탬프, 매도 가능 수량은 원장 접근자(`sellable_quantity`, 동기 잔고조회 금지)"

# ───────────────────────────────────────────────────────────────────────────────

[[stage]]
id = "dispatch"
name = "3. 디스패치 — 신호가 주문 큐에 들어가기 전 판단"
summary = "디스패치 스레드는 `pipeline_.shard_out`의 단일 소비자이자 `pipeline_.order_queue`의 단일 생산자다. 순번 stamp·비활성 차단·청산 관리 종목 차단·교체 진입·강제청산 재발주·한도 초과 정리를 한 객체(`SignalDispatcher`)가 맡고, 싱크는 큐 push와 ZMQ 신호 발행을 같이 한다."
review = [
  "`pipeline_.order_queue.push`가 이 스레드에서만 일어나는지(SPSC 불변식) — 수동 주문(`ops_.manual_inbox`)·기동 점검 매수도 여기서 합류하는지",
  "큐가 차면 기다리지 않고 버리고 세는지(`order_dropped`, D-073)",
  "교체 진입(displace) — 최약체 매도가 나간 뒤에만 매수가 풀리는지(`flush_held`)",
]

  [[stage.step]]
  sym = "Engine::strategy_thread_fn"
  file = "Quant/src/core/Engine.cpp"
  what = "루프 한 바퀴: `flush_held` → `drain_manual_inbox` → 강제청산(2초 재발주) → 기동 점검 매수·되팔기(하루 1회) → `trim_excess_once`(기동 20초 뒤 1회) → `pipeline_.shard_out` 비우기(`from_strategy`) → 잠(상한 10ms). 국면 파일은 데이터 스레드가 읽는다(6절)"

  [[stage.step]]
  sym = "dispatch::SignalDispatcher::from_strategy"
  file = "Quant/src/core/SignalDispatcher.cpp"
  what = "비활성 전략의 신규 매수·청산 관리(guardian) 종목의 신규 매수 차단 → `submit`. 판정 함수는 `set_guardian`으로 엔진이 준다"
  test = "test_signal_dispatcher"

  [[stage.step]]
  sym = "dispatch::SignalDispatcher::submit"
  file = "Quant/src/core/SignalDispatcher.cpp"
