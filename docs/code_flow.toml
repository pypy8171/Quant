# code_flow.toml — 실시간 매매(TRADE) 코드 흐름을 읽는 순서 (기계용, D-078)
#
# docs/CODE_FLOW.md는 이 파일에서 `py ../quant-devtools/gen_code_flow.py`가 만든다 — 문서를 손으로 고치지 말고 여기를 고친다.
# 줄 번호는 여기 없다. 생성기가 심볼을 소스에서 찾아 `파일#L줄` 링크와 시그니처 한 줄을 채우고, 심볼이 사라지면
# `--check`가 exit 1로 막는다(턴 끝 sync-gate·커밋 docs-gate). 그러니 여기 적을 것은 "무엇을 어느 순서로 보나"뿐이다.
#
# 항목:
#   [[stage]]        읽는 단계. id·name·summary. review는 그 단계에서 리뷰할 때 볼 항목(선택)
#   [[stage.step]]   단계 안의 한 걸음. 순서대로 나온다
#     sym   = 심볼. "Class::method" · "ns::fn" · "fn" · 타입 이름(struct/class). 마지막 조각으로 찾고 앞 조각은 정의 줄 우선에 쓴다
#     file  = 저장소 루트 기준 경로. 정의(.cpp)가 있으면 정의 파일, 헤더 온리면 헤더
#     what  = 여기서 볼 것 한 줄
#     match = (선택) 이름 없는 자리(람다·블록)를 가리킬 정규식. 있으면 sym 대신 이걸로 줄을 찾는다
#     test  = (선택) 이 걸음을 덮는 단위 테스트 실행 타깃 이름(Quant/tests/<test>.cpp)

title = "실시간 매매 코드 흐름 (CODE_FLOW)"

intro = """
TRADE 모드에서 종목을 고르고, 체결 한 건(`TradeData`)이 들어와 주문이 나가고, 체결이 원장에 닿기까지를 **읽는 순서대로** 나열한 문서다.
단계마다 심볼 링크(`파일#L줄`)·시그니처·볼 것 한 줄·덮는 테스트가 있다. 링크는 VS Code 미리보기·GitHub에서 그 줄로 열린다.

실행 파일은 `quant_trader` 하나다. `--role feed`·`--role strategy`·`--role order`로 띄우면 시세·전략·주문 세 프로세스가
공유메모리 구역 `quant.engine.{paper|live}.{계좌}`로 이어지고(D-114), 인자가 없으면(`both`) 한 프로세스가 같은 배치를 힙에 깔고
같은 통로 코드를 쓴다. 절 제목의 [시세]·[전략]·[주문]은 그 걸음이 도는 프로세스다.
유니버스(전 종목 목록·시세·순위)와 국면 판정도 엔진 안으로 옮겼다 — 목록과 시세는 네이버에서 받고(`MarketBoard`),
국면은 `RegimeFeed`가 계산해 `regime.json`에 쓰고 데이터 스레드가 그 파일을 읽어 적용한다(D-147).

스레드 모델·설계 원칙은 [CLAUDE.md](../CLAUDE.md)의 "설계 목표와 원칙"·"아키텍처" 절이 정본이고, 모듈 간 include 관계는
[CODE_GRAPH.md](CODE_GRAPH.md), 바꾼 이유는 [DECISIONS.md](DECISIONS.md)다. 이 문서는 그 셋을 대신하지 않고 **입구**만 맡는다.
"""

diagram = """
flowchart LR
  subgraph feedp[시세 프로세스 --role feed]
    WS[KisWebSocket::recv_loop ×N] --> DEC[kis_websocket::decode_*] --> PF[Engine::push_feed_trade]
    DEC --> FN[parse_fill_notification]
    PF -.-> DB[DbManager::on_trade → COPY ticks]
  end
  subgraph shm[공유메모리 구역]
    MF[MarketFeedChannel]
    RQ[요청 링 pipeline_.requests]
    RS[응답 링 order_responses]
    FC[FillChannel]
    LS[LedgerSnapshot]
    CT[제어 링 ControlPlane]
  end
  subgraph stratp[전략 프로세스 --role strategy]
    MB[MarketBoard 네이버 목록·시세] --> SC[universe::scan_devscale] --> WL[send_watch_request]
    FL[feed_lane_thread_fn] --> FO[fan_out_trade] --> SH[shard_thread_fn → 전략] --> SO[shard_out MpscQueue]
    SO --> SD[SignalDispatcher → to_request]
  end
  subgraph ordp[주문 프로세스 --role order]
    OT[order_thread_fn] --> OR[OrderRouter::new_route] --> OG[OrderGate::check] --> KIS[KisClient::submit_order_acknowledgement]
    FT[fill_thread_fn] --> OF[OrderRouter::on_fill] --> PL[PositionLedger::on_fill_confirmed] --> PB[OrderGate::publish_ledger]
  end
  PF --> MF --> FL
  SD --> RQ --> OT
  OT --> RS --> SD
  FN --> FC --> FT
  PB --> LS -.-> SH
  WL --> CT -.-> WS
"""

# ───────────────────────────────────────────────────────────────────────────────

[[stage]]
id = "boot"
name = "0. 기동 — 세 프로세스가 서고 공유메모리에 붙기까지"
summary = "감시견이 같은 exe를 `--role`만 달리해 띄운다. 구역을 만드는 쪽은 주문이라 주문을 먼저 띄우고, 전략·시세는 30초까지 붙기를 다시 시도한다. `Engine::start()`와 `spawn_threads()`가 `runs_order_side`·`runs_strategy_side`·`runs_feed_side`로 역할마다 부품과 스레드를 고른다."
review = [
  "스레드 소유권 — 각 큐·링의 생산자·소비자가 하나씩인지(`RingBuffer`는 SPSC, 생산자 둘이면 `MpscQueue`, 원칙 5). 링의 끝점은 역할마다 `SharedLayout::endpoint_for`가 정한다",
  "config 키가 `parse_config`에서 검증되고 `Engine::configure`가 세터로 옮기는지 — 빠진 키의 기본값이 실계좌에 안전한 쪽인지",
  "기동 순서 — 원장 시드(`bootstrap`)가 소켓 콜백 설치보다 앞인지(체결이 먼저 오면 원장이 비어 있다)",
  "남은 구역 물려받기 — 주인·참가자가 모두 죽었을 때만 물려받는지(PID와 기동 시각을 같이 본다)",
]

  [[stage.step]]
  sym = "Start-TraderProcess"
  file = "scripts/auto_trade_day.ps1"
  match = "^function Start-TraderProcess"
  what = "감시견이 `quant_trader.exe <config> --role <역할>`로 띄운다. `-Roles order,strategy,feed`면 셋, 기본은 `both` 하나. 하나가 죽으면 정상 종료면 20초 기다리고, 아니면 나머지를 바로 내린다"

  [[stage.step]]
  sym = "main"
  file = "Quant/src/main.cpp"
  what = "진입. 번호 주석이 초기화 순서다 — 콘솔·로거(역할별 로그 파일) → 인자 → `parse_config` → 로그 임계값 → 크래시 핸들러 → `run_trade`"

  [[stage.step]]
  sym = "parse_command_line"
  file = "Quant/src/core/CommandLine.cpp"
  what = "`--role X`를 `ProcessRole`(Both·Order·Strategy·Feed)로. 이후 모든 역할 분기는 `CommandLine.h`의 `runs_*_side` 세 함수로 본다"
  test = "test_command_line"

  [[stage.step]]
  sym = "parse_config"
  file = "Quant/src/core/AppConfig.cpp"
  what = "json → `AppConfig`. 키 누락·값 오류는 여기서 멈춘다(네트워크 전). `database`·`regime_feed` 블록도 여기서 읽는다(없으면 꺼짐)"
  test = "test_app_config"

  [[stage.step]]
  sym = "run_trade"
  file = "Quant/src/main.cpp"
  what = "`set_role` → `configure` → (전략 쪽만) `load_strategies` → `start` → (전략 쪽·설정 있을 때만) RegimeFeed 스레드 → `is_running` 대기 → `stop`"

  [[stage.step]]
  sym = "Engine::configure"
  file = "Quant/src/core/EngineConfigure.cpp"
  what = "AppConfig 값을 엔진 세터로 — 채널(ZMQ·운영단말)·국면별 전략 집합·시세 전용 KIS·리스크. 끝에서 `bind_layout`으로 역할에 맞는 공유 배치를 다시 깐다"

  [[stage.step]]
  sym = "Engine::bind_layout_on_region"
  file = "Quant/src/core/EngineLayout.cpp"
  what = "주문은 구역을 만들고 이전 판을 물려받았는지 적는다. 전략·시세는 30초까지 붙기를 다시 시도하고 상대의 `boot_generation`을 기억한다(재기동 감지용). `both`는 `bind_layout_on_heap`"

  [[stage.step]]
  sym = "ipc::SharedRegion::create"
  file = "Quant/src/ipc/SharedRegion.cpp"
  what = "이름 있는 공유메모리 생성. 같은 이름이 남아 있으면 주인·참가자 생사를 보고 둘 다 죽었을 때만 물려받고 세대 번호를 올린다. 붙는 쪽은 `attach`"
  test = "test_shared_region"

  [[stage.step]]
  sym = "ipc::SharedLayout::bind"
  file = "Quant/src/ipc/SharedLayout.cpp"
  what = "구역 안 배치 순서 — 요청 → 응답 → 제어 → 시세 제어 → 체결 → 하트비트 → 국면 → 시세 채널 → 종목 사전 → 전략 사전 → 원장 스냅숏"
  test = "test_shared_layout"

  [[stage.step]]
  sym = "Engine::adopt_shared_dictionaries"
  file = "Quant/src/core/EngineLayout.cpp"
  what = "종목·전략 사전의 역할 — 주문은 새 번호를 직접 찍고, 시세는 찾아보기만 하고(없는 종목 틱은 버림), 전략은 주문에 등록을 요청한다"

  [[stage.step]]
  sym = "Engine::start"
  file = "Quant/src/core/Engine.cpp"
  what = "도우미 호출 목록이 기동 순서다 — `setup_shards`(전략 쪽만) → [시세] `DbManager` → ZMQ·인증·폴러 → [주문] 모의 체결기·`OrderRouter`·대조기·`try_bootstrap_ledger` → [전략] `start_strategies`·`collect_watch_specifications` → [시세] `connect_feed` → `spawn_threads`"

  [[stage.step]]
  sym = "Engine::spawn_threads"
  file = "Quant/src/core/Engine.cpp"
  match = "data_thread_\\s*=\\s*std::jthread"
  what = "역할별 스레드 — 공통 data·control, [전략] 시세 줄 스레드(`feed_lane_thread_fn`)·샤드 M·strategy, [주문] order·fill. stop_token이 첫 인자라 람다로 감싼다"

  [[stage.step]]
  sym = "LedgerReconciler::bootstrap"
  file = "Quant/src/core/LedgerReconciler.cpp"
  what = "[주문] 기동 잔고 시드 — 브로커 잔고를 원장(`PositionLedger`) 포지션으로. 실패 재시도 횟수와 실패 시 기동 중단 여부"
  test = "test_ledger_reconciler"

# ───────────────────────────────────────────────────────────────────────────────

[[stage]]
id = "universe"
name = "1. 유니버스 — [전략] 볼 종목을 고르고 구독을 요청하기까지"
summary = "예전에는 파이썬이 종목 목록과 시세 파일을 만들었다. 지금은 전략 프로세스의 `MarketBoard` 스레드가 네이버에서 전 종목 목록과 현재가·거래대금·시총을 받고, `scan_devscale`이 KIS 일봉으로 걸러 점수를 매긴다. 고른 종목은 전략 객체가 되고, 구독 요청은 제어 링으로 시세 프로세스에 간다."
review = [
  "시세판이 비었을 때(첫 5초·네이버 실패) 스캔이 전날 `universe_scan.json`과 KIS 랭킹 축 가격만으로 도는지",
  "스캔이 REST를 많이 부르는 구간(일봉)이 장 전 `DailyWarm` 캐시로 빠지는지",
  "보유 종목·청산 관리 종목이 스캔 신규 등록에서 빠지는지",
]

  [[stage.step]]
  sym = "load_strategies"
  file = "Quant/src/strategy/StrategyFactory.cpp"
  what = "config `strategies[]`를 타입별 로더로 나눈다. 새 전략을 붙이는 자리(docs/ENGINE_ARCHITECTURE.md '전략 추가하기')"

  [[stage.step]]
  sym = "strategy_load::load_deviation_scale"
  file = "Quant/src/strategy/DevScaleLoader.cpp"
  what = "DEVIATION_SCALE 로더 — 보유 스냅숏 → 시세판 기동 → 초기 스캔 → 종목마다 전략 등록 → 재스캔 job 등록"

  [[stage.step]]
  sym = "start_scan_services"
  file = "Quant/src/strategy/DevScaleLoader.cpp"
  what = "`market_board:true`면 MarketBoard 스레드와 DailyWarm 스레드를 띄운다. false면 두 스레드 없이 KIS 랭킹 축과 전날 `universe_scan.json`만 쓴다"

  [[stage.step]]
  sym = "universe::MarketBoard::run"
  file = "Quant/src/universe/MarketBoard.cpp"
  what = "KST 날짜가 바뀌면 목록을 새로 받고, 5초마다 시세 한 바퀴, 60초마다 재랭킹"
  test = "test_market_board"

  [[stage.step]]
  sym = "universe::MarketBoard::refresh_listing"
  file = "Quant/src/universe/MarketBoard.cpp"
  what = "네이버 `marketValue/{KOSPI,KOSDAQ}`로 전 종목 목록(ETF·ETN 제외). 900종목씩 묶은 폴링 URL을 만든다. data.go.kr 목록을 대신한 자리"
  test = "test_market_board"

  [[stage.step]]
  sym = "universe::MarketBoard::sweep"
  file = "Quant/src/universe/MarketBoard.cpp"
  what = "폴링 URL을 동시에 불러 현재가·누적 거래대금·시총 판(`BoardSnapshot`)을 만든다"
  test = "test_market_board"

  [[stage.step]]
  sym = "universe::MarketBoard::rerank"
  file = "Quant/src/universe/MarketBoard.cpp"
  what = "거래대금이 잡힌 종목이 절반 미만이면 보류, 아니면 `rank_universe`(시장별 시총·거래대금 상위 N)로 순위를 매기고 `Quant/config/universe_scan.json`에도 쓴다"
  test = "test_market_board"

  [[stage.step]]
  sym = "start_daily_warm"
  file = "Quant/src/universe/UniverseFeatures.cpp"
  what = "장 전에 시세판 목록을 기다렸다가 전 종목 일봉을 KIS에서 미리 받아 캐시에 둔다"

  [[stage.step]]
  sym = "universe::scan_devscale"
  file = "Quant/src/universe/UniverseScanner.cpp"
  what = "스캔 본체 — 시세 표 → 지수 게이트 → 후보 수집 → 일봉 필터 → 점수 → 자르기. 아래 걸음이 이 함수 안의 순서다"

  [[stage.step]]
  sym = "load_quote_table (시세판)"
  file = "Quant/src/universe/UniverseQuotes.cpp"
  match = "^void load_quote_table\\(const BoardSnapshot"
  what = "MarketBoard 판을 시세 표(`QuoteTable`)로 붓는다. 판이 없으면 바로 위 오버로드가 파일판을 읽는다"

  [[stage.step]]
  sym = "build_market_gate"
  file = "Quant/src/universe/UniverseRiskGate.cpp"
  what = "KIS 지수 등락으로 시장별 risk-off. 둘 다 닫히면 빈 결과"

  [[stage.step]]
  sym = "detail::collect_candidates"
  file = "Quant/src/universe/UniverseCandidates.cpp"
  what = "후보 축 — 시세판 순위 → 거래대금 상위(REST 없음) → KIS 랭킹 → 업종 → 전 종목(`full_market`)"

  [[stage.step]]
  sym = "lookup_and_filter"
  file = "Quant/src/universe/UniverseFeatures.cpp"
  what = "캐시에 없는 일봉만 KIS에서 받고, 오늘 현재가를 넣은 정배열(`MaAlign`)·과확장·거래대금 필터"

  [[stage.step]]
  sym = "detail::score_cross_section"
  file = "Quant/src/universe/UniverseScoring.cpp"
  what = "추세·눌림·유동성·변동성 z점수 가중합"
  test = "test_universe_scoring"

  [[stage.step]]
  sym = "detail::rank_and_truncate"
  file = "Quant/src/universe/UniverseScoring.cpp"
  what = "점수 순으로 `score_top_n`·`max_register`만큼 잘라 최종 유니버스(`ScanResult`)"
  test = "test_universe_scoring"

  [[stage.step]]
  sym = "Engine::add_strategy"
  file = "Quant/src/core/EngineStrategyThread.cpp"
  what = "종목마다 전략 등록. 심볼 해석기가 여기서 주입된다"

  [[stage.step]]
  sym = "Engine::register_symbol"
  file = "Quant/src/core/EngineSymbols.cpp"
  what = "종목 이름 → 정수 id(원칙 6). 역할에 따라 공유 사전에 직접 찍기(주문)·요청(전략)·찾아보기(시세)"
  test = "test_shared_symbol_dictionary"

  [[stage.step]]
  sym = "Engine::collect_watch_specifications"
  file = "Quant/src/core/EngineFeed.cpp"
  what = "전략들이 보는 종목(`WatchSpec`)을 모아 중복을 빼고 고정 종목을 앞에 둔다"

  [[stage.step]]
  sym = "Engine::send_watch_request"
  file = "Quant/src/core/EngineFeed.cpp"
  what = "구독·해지·우선순위 요청을 제어 링으로 시세 프로세스에 보낸다"

# ───────────────────────────────────────────────────────────────────────────────

[[stage]]
id = "recv"
name = "2. 수신 — [시세] 소켓 바이트에서 공유 시세 채널까지"
summary = "소켓 읽기 스레드는 얇다(원칙 3): 프레임 → 필드 분리 → 구조체 → `received_ns` 스탬프 → 시세 채널 push. 문자열은 여기서 끝나고 종목은 정수 id가 된다(원칙 6). 한 프로세스(`both`)면 채널 없이 바로 샤드로 간다."
review = [
  "수신 스레드에 힙 할당·문자열 생성·락이 있는지 — 있으면 소비자로 옮길 후보",
  "`received_ns`가 디코드 직후 한 번만 찍히는지(호가·체결 같은 시계, D-071)",
