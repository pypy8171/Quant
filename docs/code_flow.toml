  what = "AES 복호화 → `decode_fill` → `on_fill_` 콜백"

  [[stage.step]]
  sym = "kis_websocket::decode_fill"
  file = "Quant/include/api/KisWsDecode.h"
  what = "체결통보 필드 → `FillNotification`(ODNO·체결/거부·수량·가격). 거부 통보도 같은 채널"
  test = "test_ws_decode"

  [[stage.step]]
  sym = "Engine::push_fill_notice"
  file = "Quant/src/core/EngineFeed.cpp"
  what = "시세 역할이면 체결 채널로, 아니면 프로세스 안 `fill_queue`로. 채널이 차면 넘침 칸에 쌓고 control 스레드가 5초마다 다시 보낸다"

  [[stage.step]]
