  file = "Quant/src/core/EngineFillThread.cpp"
  what = "주문 역할이면 체결 채널에서(100ms 폴링), 아니면 `fill_queue`에서 꺼낸다 → `on_fill` → `ledger_->note_fill`(대조 5초 유예, D-074) → 운영단말 `broadcast`(FILL) → 원장 발행"

  [[stage.step]]
  sym = "OrderRouter::on_fill"
  file = "Quant/src/ipc/OrderRouter.cpp"
  what = "ODNO로 주문 찾기 → 상태 갱신 → `gate_.ledger().on_fill_confirmed` → 원장 CSV. 못 찾으면 미연결 체결 경로"
