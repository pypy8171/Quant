services:

  # ── C++ 트레이딩 엔진 ────────────────────────────────────────────────────────
  quant-engine:
    build:
      context: .
      dockerfile: Quant/Dockerfile
    container_name: quant-engine
    volumes:
      # 인증정보가 담긴 config.json 을 읽기 전용으로 마운트
      - ./Quant/config:/app/config:ro
      # KIS 토큰 캐시 공유 볼륨 — 엔진이 발급→balance가 재사용(중복발급/403 방지)
      - token-cache:/app/.tokcache
    ports:
      - "5555:5555"   # ZMQ PUB  (시장데이터·신호 발행)
      - "5556:5556"   # ZMQ REP  (엔진 원격 제어)
    environment:
      TZ: Asia/Seoul
      KIS_TOKEN_CACHE_DIR: /app/.tokcache
    # 모의투자 TRADE 모드 기본 실행
    # 실거래 전환: command: ["./quant_trader", "config/config.json", "TRADE"]
    command: ["./quant_trader", "config/config_paper.json", "TRADE"]
    restart: unless-stopped
    networks:
      - quant-net

  # ── Python 레이어 (모니터 / 백테스트 / 운영 커맨드) ─────────────────────────
  quant-python:
    build:
      context: .
      dockerfile: PYQuant/Dockerfile
    container_name: quant-python
    depends_on:
      - quant-engine
    volumes:
      # config.json 공유 (KIS REST 인증 필요 시)
      - ./Quant/config:/app/config:ro
      # KIS 토큰 캐시 공유 — 엔진 발급 토큰 재사용(중복발급/403 방지)
      - token-cache:/app/.tokcache
    environment:
      TZ: Asia/Seoul
      ENGINE_HOST: quant-engine
      KIS_TOKEN_CACHE_DIR: /app/.tokcache
    # 기본: 엔진 이벤트 모니터링
    command: ["monitor", "--host", "quant-engine", "--port", "5555"]
    networks:
      - quant-net

  # ── Phase 2: TimescaleDB (OHLCV / 체결 데이터 영속화) ──────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: quant-tsdb
    environment:
      POSTGRES_DB:       quant
      POSTGRES_USER:     quant
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-changeme}
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      # 최초 기동 시 스키마 자동 적용
      - ./PYQuant/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quant-net

  # ── ZMQ → TimescaleDB 적재 (C++ 엔진 이벤트를 DB에 저장) ──────────────────
  quant-recorder:
    build:
      context: .
      dockerfile: PYQuant/Dockerfile
    container_name: quant-recorder
    depends_on:
      quant-engine:
        condition: service_started
      timescaledb:
        condition: service_healthy
    volumes:
      - ./Quant/config:/app/config:ro
    environment:
      TZ: Asia/Seoul
      ENGINE_HOST: quant-engine
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      TSDB_DB: quant
      TSDB_USER: quant
      TSDB_PASSWORD: ${TSDB_PASSWORD:-changeme}
    command: ["record", "--host", "quant-engine", "--port", "5555"]
    restart: unless-stopped
    networks:
      - quant-net

networks:
  quant-net:
    driver: bridge

volumes:
  tsdb-data:
  token-cache:
