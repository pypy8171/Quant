  #   environment:
  #     POSTGRES_DB:       quant
  #     POSTGRES_USER:     quant
  #     POSTGRES_PASSWORD: ${TSDB_PASSWORD:-changeme}
  #   volumes:
  #     - tsdb-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - quant-net

networks:
  quant-net:
    driver: bridge

