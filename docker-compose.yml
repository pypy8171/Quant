services:

  # ── C++ 트레이딩 엔진 ────────────────────────────────────────────────────────
  quant-engine:
    build:
      context: .
      dockerfile: Quant/Dockerfile
    container_name: quant-engine
    volumes:
      # 인증정보가 담긴 config.json 을 읽기 전용으로 마운트
      - ./Quant/config:/app/config:ro
    ports:
      - "5555:5555"   # ZMQ PUB  (시장데이터·신호 발행)
      - "5556:5556"   # ZMQ REP  (엔진 원격 제어)
    environment:
      TZ: Asia/Seoul
    # 기본 실행 모드: KR_TEST (docker compose up quant-engine 으로 바로 실행)
    command: ["./quant_trader", "config/config.json", "KR_TEST"]
    restart: unless-stopped
    networks:
      - quant-net

  # ── Python 레이어 (모니터 / 백테스트 / 운영 커맨드) ─────────────────────────
  quant-python:
    build:
      context: .
      dockerfile: PYQuant/Dockerfile
    container_name: quant-python
    depends_on:
      - quant-engine
    volumes:
      # config.json 공유 (KIS REST 인증 필요 시)
      - ./Quant/config:/app/config:ro
    environment:
      TZ: Asia/Seoul
      ENGINE_HOST: quant-engine
    # 기본: 엔진 이벤트 모니터링
    command: ["monitor", "--host", "quant-engine", "--port", "5555"]
    networks:
      - quant-net

  # ── Phase 2: TimescaleDB (OHLCV / 체결 데이터 영속화) ──────────────────────
  # timescaledb:
  #   image: timescale/timescaledb:latest-pg16
